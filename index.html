<style>
:root{--bg:#06030f;--violet:#7c3aed;--cyan:#22d3ee;--pink:#ff3d9a;--ember:#ff7a2f;--txt:#f6f3ff;--mut:#b8b0d8;--glass:rgba(255,255,255,.06);--line:rgba(255,255,255,.15)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;overflow-x:hidden;max-width:100%}
body{background:var(--bg);color:var(--txt);font-family:Cairo,system-ui,"Segoe UI",Tahoma,sans-serif;line-height:1.7;overflow-x:clip;max-width:100%;min-height:100vh}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--cyan);outline-offset:3px;border-radius:12px}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aurora i{position:absolute;width:55vmax;height:55vmax;border-radius:50%;filter:blur(90px);opacity:.5;animation:drift 24s ease-in-out infinite alternate}
.aurora i:nth-child(1){background:var(--violet);top:-20vmax;inset-inline-start:-15vmax}
.aurora i:nth-child(2){background:var(--cyan);bottom:-25vmax;inset-inline-end:-20vmax;animation-duration:30s;opacity:.38}
.aurora i:nth-child(3){background:var(--pink);top:30vh;inset-inline-start:35vw;width:40vmax;height:40vmax;animation-duration:36s;opacity:.3}
.aurora i:nth-child(4){background:var(--ember);bottom:-30vmax;inset-inline-start:-10vmax;width:38vmax;height:38vmax;animation-duration:28s;opacity:.22}
@keyframes drift{to{transform:translate(9vw,7vh) scale(1.18) rotate(25deg)}}
.wrap{position:relative;z-index:1;width:min(1180px,100% - 40px);margin-inline:auto}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 0}
.brand{display:flex;align-items:center;gap:12px;font-weight:900;letter-spacing:.04em}
.brand img{width:44px;height:44px;border-radius:50%;box-shadow:0 0 20px rgba(34,211,238,.5)}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4)}
.lang{cursor:pointer;color:var(--txt);font:800 .95rem Cairo,sans-serif;padding:8px 20px;border-radius:99px;transition:background .25s,box-shadow .25s}
.lang:hover{background:rgba(255,255,255,.14);box-shadow:0 0 22px rgba(124,58,237,.6)}
.hero{display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:30px;padding:30px 0 60px}
.hero-text>*{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
.hero-text>:nth-child(2){animation-delay:.15s}.hero-text>:nth-child(3){animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(28px)}}
h1{font-size:clamp(3.4rem,12.5vw,8.4rem);font-weight:900;line-height:1;letter-spacing:-.02em;direction:ltr;text-align:start;background:linear-gradient(100deg,var(--cyan),#fff 30%,var(--violet) 55%,var(--pink),var(--cyan));background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rise .9s both,shine 9s linear infinite}
@keyframes shine{to{background-position:-250% 0}}
.tag{font-size:clamp(1.1rem,2.6vw,1.5rem);color:var(--mut);margin:14px 0 28px;max-width:30ch}
.cta{display:flex;flex-wrap:wrap;gap:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:14px 28px;border-radius:99px;font-weight:800;font-size:1.05rem;transition:transform .25s,box-shadow .25s}
.btn:hover{transform:translateY(-3px)}
.btn.main{background:linear-gradient(110deg,var(--violet),var(--pink));box-shadow:0 10px 34px rgba(255,61,154,.38)}
.btn.main:hover{box-shadow:0 14px 44px rgba(255,61,154,.6)}
.btn.alt:hover{box-shadow:0 0 30px rgba(34,211,238,.45)}
.orb{position:relative;justify-self:center;width:min(430px,82vw);aspect-ratio:1;animation:float 7s ease-in-out infinite}
.orb>img.logo{width:100%;border-radius:50%;box-shadow:0 0 90px rgba(34,211,238,.4),0 0 160px rgba(124,58,237,.35)}
.orb>img.mascot{position:absolute;height:64%;bottom:-6%;inset-inline-end:-14%;filter:drop-shadow(0 12px 22px rgba(0,0,0,.55));animation:float 5s ease-in-out -2s infinite}
@keyframes float{50%{transform:translateY(-14px)}}
h2{font-size:clamp(1.8rem,5vw,2.8rem);font-weight:900;margin-bottom:6px}
.sub{color:var(--mut);margin-bottom:26px}
section{padding:36px 0}
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(250px,100%),1fr));gap:20px}
.card{--g:var(--cyan);position:relative;display:block;aspect-ratio:1;border-radius:26px;overflow:hidden;border:1px solid var(--line);transition:transform .3s,box-shadow .3s,border-color .3s;isolation:isolate}
.card:hover{transform:translateY(-8px);border-color:var(--g);box-shadow:0 18px 50px -8px var(--g)}
.card>img.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s;z-index:-1}
.card:hover>img.art{transform:scale(1.07)}
.cap{position:absolute;inset-inline:10px;bottom:10px;padding:12px 18px;border-radius:18px;background:rgba(8,4,22,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.14)}

/* ===== ID card ===== */
.idcard{--mx:50%;--my:50%;position:relative;direction:ltr;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:32px;margin-top:70px;padding:28px 34px;border-radius:30px;background:linear-gradient(135deg,rgba(124,58,237,.26),rgba(255,255,255,.05) 48%,rgba(34,211,238,.2));border:1px solid rgba(34,211,238,.38);box-shadow:inset 0 0 0 1px rgba(124,58,237,.28),0 22px 60px -22px rgba(124,58,237,.7),0 0 46px -12px rgba(34,211,238,.4)}
.idcard::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(420px circle at var(--mx) var(--my),rgba(34,211,238,.2),transparent 62%);opacity:0;transition:opacity .3s}
.idcard:hover::before{opacity:1}
.id-art{position:relative;width:clamp(170px,21vw,230px);aspect-ratio:1;border-radius:26px;border:2px solid rgba(34,211,238,.7);background:radial-gradient(circle at 50% 32%,#4b22b0,#1a0b45 62%,#0b0522);box-shadow:0 0 28px rgba(34,211,238,.5),0 0 74px rgba(124,58,237,.4),inset 0 0 32px rgba(34,211,238,.2);transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .18s ease-out,box-shadow .3s;will-change:transform;touch-action:pan-y}
.idcard:hover .id-art{box-shadow:0 0 38px rgba(34,211,238,.7),0 0 90px rgba(124,58,237,.55),inset 0 0 32px rgba(34,211,238,.28)}
.id-pic{position:absolute;inset:0;clip-path:inset(-60% -25% 0 -25% round 0 0 24px 24px)}
.id-pic img{position:absolute;left:50%;bottom:0;height:132%;width:auto;max-width:none;transform:translateX(-50%) translate(var(--px,0px),var(--py,0px));transition:transform .18s ease-out;filter:drop-shadow(0 14px 22px rgba(0,0,0,.6));-webkit-user-drag:none;user-select:none}
.id-info{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0}
.id-game{font-weight:800;font-size:.9rem;letter-spacing:.22em;color:var(--cyan)}
.id-name{font-size:clamp(2.2rem,6vw,3.8rem);font-weight:900;line-height:1.1;letter-spacing:-.01em;background:linear-gradient(100deg,var(--cyan),#fff 40%,var(--violet) 70%,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.id-num{margin-top:6px;font:900 clamp(1.4rem,3.6vw,2.2rem) ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.1em;color:var(--txt);text-shadow:0 0 18px rgba(34,211,238,.55);user-select:all;direction:ltr;overflow-wrap:anywhere}
.id-copy{border:0;cursor:pointer;color:var(--txt);font-family:Cairo,sans-serif;min-width:180px;white-space:nowrap}
html[dir=rtl] .id-copy{direction:rtl}
.id-copy.done{background:linear-gradient(110deg,#16a34a,var(--cyan));box-shadow:0 10px 34px rgba(34,211,238,.45)}
.banner{border-radius:30px;overflow:hidden;padding:8px}
.banner img{width:100%;border-radius:24px;aspect-ratio:16/7;object-fit:cover}

.suggest{display:grid;grid-template-columns:.7fr 1.3fr;gap:28px;align-items:center}
.suggest .sg-art{justify-self:center;height:min(430px,60vw);width:auto;filter:drop-shadow(0 14px 26px rgba(0,0,0,.55));animation:float 6s ease-in-out infinite}
.sg-form{position:relative;border-radius:26px;padding:26px;display:flex;flex-direction:column;gap:14px}
.sg-form h2{margin-bottom:0}
.sg-form label{font-weight:800;font-size:.98rem}
.sg-form input,.sg-form textarea{width:100%;margin-top:6px;padding:13px 16px;border-radius:16px;border:1px solid var(--line);background:rgba(8,4,22,.55);color:var(--txt);font:600 1rem Cairo,sans-serif;transition:border-color .25s,box-shadow .25s}
.sg-form textarea{min-height:140px;resize:vertical}
.sg-form input::placeholder,.sg-form textarea::placeholder{color:var(--mut);opacity:.7}
.sg-form input:focus,.sg-form textarea:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,211,238,.25)}
.sg-form .btn{border:0;cursor:pointer;color:var(--txt);font-family:Cairo,sans-serif;align-self:flex-start;margin-top:4px}
.sg-form .btn:disabled{opacity:.6;cursor:wait}
.sg-hp{position:absolute;top:0;inset-inline-start:0;width:1px;height:1px;padding:0;border:0;opacity:0;overflow:hidden;clip-path:inset(50%);pointer-events:none}
.sg-msg{min-height:1.6em;font-weight:700}
.sg-msg.ok{color:#4ade80}.sg-msg.bad{color:#ff6b8a}
@media(max-width:860px){.suggest{grid-template-columns:1fr}}
footer{text-align:center;color:var(--mut);padding:36px 0 50px;font-size:.95rem}
footer b{color:var(--txt);letter-spacing:.06em}
@media(max-width:860px){.hero{grid-template-columns:1fr;text-align:center;padding-top:10px}.hero-text{display:flex;flex-direction:column;align-items:center}h1{text-align:center}.orb{margin-bottom:30px}.idcard{grid-template-columns:1fr;justify-items:center;gap:22px;padding:26px 20px 24px}.id-art{width:min(230px,62vw)}.id-copy{width:100%;min-height:58px;font-size:1.15rem}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none !important;transition:none !important;scroll-behavior:auto !important}}
</style>
</head>

<script>
const T={
ar:{tag:"محتوى ببجي موبايل والجيمنج بأسلوب مختلف",cta1:"تابعني على تيك توك",cta2:"حمّل ببجي موبايل",linksT:"روابطي",linksS:"كل حساباتي في مكان واحد",yt:"يوتيوب",ytS:"اشترك وفعّل الجرس",tt:"تيك توك",ttS:"تابعني على تيك توك",gm:"تواصل معي",gmS:"للإعلانات والتعاون",dl:"حمّل ببجي موبايل",dlS:"حمّل اللعبة من هنا",idT:"بطاقتي في اللعبة",idS:"انسخ الـ ID وضيفني في ببجي موبايل",idCopy:"نسخ الـ ID",idCopied:"تم النسخ! ✓",idFail:"اضغط مطولًا على الرقم لنسخه",foot:"كل الحقوق محفوظة",sgT:"اقتراحك يهمني",sgS:"قولي رأيك أو فكرتك وهتوصلني أنا بس",sgName:"اسمك",sgNameP:"اكتب اسمك هنا",sgMsg:"اقتراحك",sgMsgP:"اكتب اقتراحك هنا...",sgSend:"إرسال الاقتراح",sgSending:"جاري الإرسال...",sgOk:"وصلني اقتراحك، شكراً ليك! 💜",sgBad:"حصلت مشكلة في الإرسال، جرّب تاني بعد شوية.",sgEmpty:"من فضلك اكتب اسمك واقتراحك.",sgOff:"الإرسال لسه متفعّلش."},
en:{tag:"PUBG Mobile and gaming content, done differently",cta1:"Follow me on TikTok",cta2:"Download PUBG Mobile",linksT:"My links",linksS:"All my accounts in one place",yt:"YouTube",ytS:"Subscribe and hit the bell",tt:"TikTok",ttS:"Follow me on TikTok",gm:"Contact me",gmS:"For ads and collaborations",dl:"Download PUBG Mobile",dlS:"Get the game here",idT:"My in-game card",idS:"Copy my ID and add me in PUBG Mobile",idCopy:"Copy ID",idCopied:"Copied! ✓",idFail:"Long-press the number to copy it",foot:"All rights reserved",sgT:"Your suggestion matters",sgS:"Share your idea, only I will see it",sgName:"Your name",sgNameP:"Type your name",sgMsg:"Your suggestion",sgMsgP:"Type your suggestion here...",sgSend:"Send suggestion",sgSending:"Sending...",sgOk:"Got it, thank you! 💜",sgBad:"Something went wrong, please try again later.",sgEmpty:"Please enter your name and suggestion.",sgOff:"Sending is not enabled yet."}};
const btn=document.getElementById('lang');let cur='ar';
function setLang(l){cur=l;document.documentElement.lang=l;document.documentElement.dir=l==='ar'?'rtl':'ltr';
document.querySelectorAll('[data-i]').forEach(e=>e.textContent=T[l][e.dataset.i]);
document.querySelectorAll('[data-p]').forEach(e=>e.placeholder=T[l][e.dataset.p]);
btn.textContent=l==='ar'?'EN':'عربي';btn.setAttribute('aria-label',l==='ar'?'Switch to English':'التبديل إلى العربية')}
btn.addEventListener('click',()=>setLang(cur==='ar'?'en':'ar'));setLang('ar');
const rm=matchMedia('(prefers-reduced-motion: reduce)').matches,c=document.getElementById('stars'),x=c.getContext('2d');let W,H,S=[];
function rs(){W=c.width=innerWidth;H=c.height=innerHeight;S=Array.from({length:Math.min(130,W*H/13000|0)},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.3+.2,p:Math.random()*6.28,v:Math.random()*.02+.006}))}
function draw(t){x.clearRect(0,0,W,H);x.fillStyle='#fff';for(const s of S){x.globalAlpha=.3+.7*Math.abs(Math.sin(s.p+t*s.v*.1));x.beginPath();x.arc(s.x,s.y,s.r,0,6.283);x.fill()}if(!rm)requestAnimationFrame(draw)}
addEventListener('resize',()=>{rs();if(rm)draw(0)});rs();draw(0);

/* ===== Suggestions form =====
   Put your free Web3Forms access key here (https://web3forms.com).
   Suggestions are emailed to you only. */
const WEB3FORMS_KEY='098c3d86-f6b7-4f06-b5c8-39fa9fbe0dbe';
const sgForm=document.getElementById('sgForm'),sgStatus=document.getElementById('sgStatus');
function sgSay(k,cls){sgStatus.textContent=T[cur][k];sgStatus.className='sg-msg '+(cls||'')}
sgForm.addEventListener('submit',async e=>{
  e.preventDefault();
  const f=new FormData(sgForm),name=(f.get('name')||'').trim(),message=(f.get('message')||'').trim();
  if(f.get('botcheck'))return;
  if(!name||!message){sgSay('sgEmpty','bad');return}
  if(!WEB3FORMS_KEY){sgSay('sgOff','bad');return}
  const b=sgForm.querySelector('button');b.disabled=true;sgSay('sgSending');
  try{
    const r=await fetch('https://api.web3forms.com/submit',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},
      body:JSON.stringify({access_key:WEB3FORMS_KEY,subject:'New suggestion from '+name,from_name:'JOYBOY.COM',name,message})});
    const d=await r.json();
    if(d.success){sgForm.reset();sgSay('sgOk','ok')}else sgSay('sgBad','bad');
  }catch(_){sgSay('sgBad','bad')}
  b.disabled=false;
});

/* ===== ID card: tilt + copy ===== */
const idCard=document.getElementById('idCard'),idArt=document.getElementById('idArt'),idNumEl=document.getElementById('idNum'),cpBtn=document.getElementById('idCopy'),idNum=idNumEl.textContent.trim();
if(!rm){
  const cl=v=>Math.max(-1,Math.min(1,v));
  idCard.addEventListener('pointermove',e=>{
    const r=idCard.getBoundingClientRect(),a=idArt.getBoundingClientRect(),
      dx=cl((e.clientX-(a.left+a.width/2))/(r.width/2)),dy=cl((e.clientY-(a.top+a.height/2))/(r.height/2));
    idCard.style.setProperty('--mx',(e.clientX-r.left)+'px');
    idCard.style.setProperty('--my',(e.clientY-r.top)+'px');
    idArt.style.setProperty('--ry',(dx*14)+'deg');
    idArt.style.setProperty('--rx',(-dy*14)+'deg');
    idArt.style.setProperty('--px',(dx*6)+'px');
    idArt.style.setProperty('--py',(dy*4)+'px');
  });
  idCard.addEventListener('pointerleave',()=>{
    ['--rx','--ry','--px','--py','--mx','--my'].forEach(k=>{idArt.style.removeProperty(k);idCard.style.removeProperty(k)});
  });
}
let cpTimer;
function cpShow(key,done){
  cpBtn.textContent=T[cur][key];cpBtn.classList.toggle('done',!!done);
  clearTimeout(cpTimer);
  cpTimer=setTimeout(()=>{cpBtn.textContent=T[cur].idCopy;cpBtn.classList.remove('done')},2200);
}
cpBtn.addEventListener('click',async()=>{
  try{await navigator.clipboard.writeText(idNum);cpShow('idCopied',true);return}catch(_){}
  try{
    const t=document.createElement('textarea');t.value=idNum;t.setAttribute('readonly','');
    t.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(t);
    t.select();t.setSelectionRange(0,99);const ok=document.execCommand('copy');t.remove();
    if(ok){cpShow('idCopied',true);return}
  }catch(_){}
  const s=getSelection(),rg=document.createRange();rg.selectNodeContents(idNumEl);s.removeAllRanges();s.addRange(rg);
  cpShow('idFail',false);
});
</script>
</body>
